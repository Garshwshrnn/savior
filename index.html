<!DOCTYPE html>
<html>
<style>
	
@property --coloryes {
  syntax: '<color>';
  initial-value: #3498db;
  inherits: false;
}
  body{
  		background-color: var(--coloryes);
      animation: colorChange 4s infinite alternate; 
  }

  @keyframes colorChange {
    0% {
      --coloryes: #3498db;
    }
    50% {
      --coloryes: #f1c40f;
    }
    100% {
      --coloryes: #e74c3c;
    }
  }
  h1{
      font-family: monospace;
      text-align: center;
  }
  h2 { 
	  background-color: white;
      color: transparent; 
      cursor: pointer;
      transition: color 1s ease;
      }
  h2 span { 
    color: black; 
    font-size: 10 pt;
  } 

  h2:hover { 
    color: var(--coloryes); 
       animation: colorChange 4s infinite alternate; 
  }
  h2:hover span{ 
    color: white; 
    transition: color 0.75s ease-in-out;
  }

</style>
