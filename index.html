<!DOCTYPE html>
<html>
<style>
	
@property --coloryes {
  syntax: '<color>';
  initial-value: #3498db;
  inherits: false;
}
  body{
  		background-color: var(--coloryes);
      animation: colorChange 4s infinite alternate; 
      text-align: center;
  }

  @keyframes colorChange {
    0% {
      --coloryes: #3498db;
    }
    50% {
      --coloryes: #f1c40f;
    }
    100% {
      --coloryes: #e74c3c;
    }
  }
  h1{
      font-family: monospace;
      text-align: center;
  }
  h2 { 
	  background-color: white;
      color: transparent; 
      cursor: pointer;
      transition: color 1s ease;
	  font-family: Impact;
      }
  h2 span { 
    color: black; 
    font-size: 10 pt;
  } 

  h2:hover { 
    color: var(--coloryes); 
       animation: colorChange 4s infinite alternate; 
  }
  h2:hover span{ 
    color: white; 
    transition: color 0.75s ease-in-out;
  }

</style>
<body>


<h1>upon opening this website, turn on volume</h1>

<iframe src="https://giphy.com/embed/13Iu9mjLpXF0ek" width="480" height="269" style="" frameBorder="0" allowFullScreen></iframe>

<h2 id="start-event-element"><span>hover here</span> HAPPY BIRTHDAY salvador</h2>

<audio id="bg-audio" controls autoplay>
  <source src="LGBR.mp3" type="audio/mpeg">
  <source src="LGBR.mov" type="audio/mpeg">
Your browser does not support the audio element.
</audio>


	<script>
		const audio = document.getElementById('bg-audio');
		const button = document.getElementById('start-event-element');
		
		button.addEventListener('pointerenter', () => {
		  audio.play()
			.then(() => {
			  console.log("Audio playing successfully.");
			  button.style.display = 'none'; // Hide the button after interaction
			})
			.catch(error => {
			  console.error("Playback failed:", error);
			});
		});

	</script>
</body>
</html>
